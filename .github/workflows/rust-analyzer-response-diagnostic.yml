name: CodeStrike rust-analyzer response diagnosis

on:
  push:
    branches: [codex/rust-analyzer-response-diagnostic-20261021]

permissions:
  contents: read

jobs:
  public-fixture-stdio-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 8
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record the untouched hosted toolchain precondition
        shell: pwsh
        run: |
          rustup show active-toolchain
          rustup component list --installed
          $sysroot = (& rustc --print sysroot).Trim()
          "Original runner rust-src present: $(Test-Path (Join-Path $sysroot 'lib/rustlib/src/rust/library/std/src/io/mod.rs'))"
      - name: Select the exact failing GUI toolchain without adding rust-src
        shell: pwsh
        run: |
          # Match the failing image's minimal profile + rustfmt/clippy and Windows targets,
          # then the GUI workflow's rust-analyzer/WASI additions. Preserve any existing rust-src.
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --component rust-analyzer --target i686-pc-windows-msvc --target x86_64-pc-windows-gnu --target wasm32-wasip1 --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'The known failing toolchain could not be selected' }
      - name: Verify the same local rust-analyzer and compiler
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: 1.99.1-x86_64-pc-windows-msvc
        run: |
          $server = (& rust-analyzer --version).Trim()
          $compiler = (& rustc --version).Trim()
          $server
          $compiler
          if ($server -ne 'rust-analyzer 1.99.1 (58cf8f9c 2026-10-13)' -or $compiler -ne 'rustc 1.99.1 (58cf8f9c3 2026-10-13)') {
            throw 'The hosted toolchain differs from the failing e615 GUI run; no equivalent diagnosis is claimed.'
          }
      - name: Record response, error and cancellation evidence for the unchanged public fixture
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: 1.99.1-x86_64-pc-windows-msvc
        run: python scripts/diagnostics/rust_analyzer_stdio.py
