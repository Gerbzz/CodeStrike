name: CodeStrike stock diagnostic configuration audit
on:
  pull_request:
    branches: [gerbzz/lapce-only-cutover]
  push:
    branches: [gerbzz/stock-diagnostic-audit]
permissions:
  contents: read
jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record exact installed toolchain
        shell: pwsh
        run: |
          rustup component add rust-analyzer
          rust-analyzer --version
          Get-FileHash (Get-Command rust-analyzer).Source -Algorithm SHA256
          rustc --version
      - name: Replay exact native sequence with and without didSave
        shell: pwsh
        run: python scripts/analyzer/probe-gui-diagnostic-replay.py --binary (Get-Command rust-analyzer).Source

      - name: Retain diagnostic comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-diagnostic-comparison
          path: artifacts/gui-diagnostic-replay.json
          if-no-files-found: warn
