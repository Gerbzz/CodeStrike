[package]
name = "codestrike"
version = "0.1.0"
edition = "2024"
description = "Local Rust source editing and diagnostics"

autobins = false
default-run = "codestrike"

[[bin]]
name = "codestrike"
path = "src/main.rs"

[[bin]]
name = "codestrike-core-tool"
path = "tools/core-cli.rs"

[dependencies]
ropey = "=1.6.1"
regex = "=1.13.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }


