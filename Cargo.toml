[package]
name = "codestrike"
version = "0.1.0"
edition = "2024"
description = "Local Rust source editing and diagnostics"

[features]
desktop = ["dep:eframe", "dep:rfd", "dep:png"]

[[bin]]
name = "codestrike-desktop"
path = "src/bin/desktop.rs"
required-features = ["desktop"]

[dependencies]
ropey = "=1.6.1"
regex = "=1.13.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
eframe = { version = "=0.30.0", default-features = false, features = ["glow", "default_fonts"], optional = true }
rfd = { version = "=0.15.4", optional = true }
png = { version = "=0.18.1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }


